[build]
  publish = "."

# --- 1. Domain consolidation: non-www → www ---
[[redirects]]
  from = "https://kinetic-energy.co.uk/*"
  to = "https://www.kinetic-energy.co.uk/:splat"
  status = 301
  force = true

# --- 2. Redirect Squarespace leftover pages to homepage ---
[[redirects]]
  from = "/cart"
  to = "/"
  status = 301

[[redirects]]
  from = "/cart.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/_downloads"
  to = "/"
  status = 301

[[redirects]]
  from = "/_downloads.html"
  to = "/"
  status = 301

# --- 3. Remove .html extension from all indexed URLs (SEO deduplication) ---
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/insight/*.html"
  to = "/insight/:splat"
  status = 301

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301

# --- 3. Security headers ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
